name: Build Android synth APKs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile MetroGaia and LOOM
        run: gradle --no-daemon :metro:assembleDebug :loom:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MetroGaia-Android-APK
          path: metro/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LOOM-Android-APK
          path: loom/build/outputs/apk/debug/*.apk
